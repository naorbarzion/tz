<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
   <base target="_top">
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta name="robots" content="noindex,nofollow">
   <title>Tracer - תפריט ראשי</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
   <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   <style>
       body {
           font-family: 'Rubik', sans-serif;
           background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
           background-size: 400% 400%;
           animation: gradient 15s ease infinite;
           min-height: 100vh;
       }

       @keyframes gradient {
           0% { background-position: 0% 50%; }
           50% { background-position: 100% 50%; }
           100% { background-position: 0% 50%; }
       }

       .glass {
           background: rgba(255, 255, 255, 0.85);
           backdrop-filter: blur(10px);
           -webkit-backdrop-filter: blur(10px);
           border: 1px solid rgba(255, 255, 255, 0.18);
           box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
       }

       .menu-item {
           transition: all 0.3s ease;
           transform-style: preserve-3d;
       }

       .menu-item:hover {
           transform: translateY(-5px);
           box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
       }

       .menu-item:active {
           transform: translateY(0);
       }

       .float-in {
           animation: float-in 0.8s ease-out;
       }

       @keyframes float-in {
           0% {
               opacity: 0;
               transform: translateY(20px);
           }
           100% {
               opacity: 1;
               transform: translateY(0);
           }
       }

       .icon-container {
           background: linear-gradient(45deg, #3b82f6, #2563eb);
           width: 60px;
           height: 60px;
           border-radius: 50%;
           display: flex;
           align-items: center;
           justify-content: center;
           margin-bottom: 1rem;
           transition: all 0.3s ease;
       }

       .menu-item:hover .icon-container {
           transform: rotate(360deg);
       }
   </style>
</head>
<body class="flex items-center justify-center p-4">
   <div class="w-full max-w-4xl float-in">
       <!-- Logo Container -->
       <div class="text-center mb-8">
           <img src="https://tracer.co.il/wp-content/uploads/elementor/thumbs/Logo-H-p8d906f0bmrgobnn9uwquzibery89mtbvr1plpc910.png" 
                alt="Tracer Logo" 
                class="h-16 mx-auto mb-4 hover:scale-105 transition-transform">
       </div>

       <!-- Menu Grid -->
       <div class="glass rounded-2xl p-8 shadow-2xl">
           <h1 class="text-2xl font-bold text-gray-800 text-center mb-8">תפריט ראשי</h1>
           
           <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
               <!-- תסריט שיחה - תיאום פגישות קבלנים -->
               <a href="sales-script.html" class="menu-item glass rounded-xl p-6 text-center">
                   <div class="icon-container mx-auto">
                       <i class="fas fa-hard-hat text-2xl text-white"></i>
                   </div>
                   <h3 class="text-xl font-semibold text-gray-800 mb-2">תסריט שיחה</h3>
                   <p class="text-gray-600">תיאום פגישות קבלנים</p>
               </a>

               <!-- תסריט שיחה - טרייסר עלוקה -->
               <a href="leech-script.html" class="menu-item glass rounded-xl p-6 text-center">
                   <div class="icon-container mx-auto">
                       <i class="fas fa-comments text-2xl text-white"></i>
                   </div>
                   <h3 class="text-xl font-semibold text-gray-800 mb-2">תסריט שיחה</h3>
                   <p class="text-gray-600">טרייסר עלוקה</p>
               </a>

               <!-- שיחות מכירה מוצלחות -->
               <a href="#" class="menu-item glass rounded-xl p-6 text-center">
                   <div class="icon-container mx-auto">
                       <i class="fas fa-star text-2xl text-white"></i>
                   </div>
                   <h3 class="text-xl font-semibold text-gray-800 mb-2">שיחות מכירה</h3>
                   <p class="text-gray-600">טרייסר עלוקה - שיחות מוצלחות</p>
               </a>

               <!-- הזנת הזמנה -->
               <a href="order-form.html" class="menu-item glass rounded-xl p-6 text-center">
                   <div class="icon-container mx-auto">
                       <i class="fas fa-file-invoice text-2xl text-white"></i>
                   </div>
                   <h3 class="text-xl font-semibold text-gray-800 mb-2">הזנת הזמנה</h3>
                   <p class="text-gray-600">טופס הזמנה דיגיטלי</p>
               </a>

               <!-- נתוני מכירות -->
               <a href="https://script.google.com/a/macros/tracer.co.il/s/AKfycbziASwDQY8SxSQhqQZWYCo5yY9my2c5R3YP3YkrECeQCdxCZsG7oTHKveEu3g1DJ9nUuQ/exec" 
                  target="_blank" 
                  class="menu-item glass rounded-xl p-6 text-center">
                   <div class="icon-container mx-auto relative">
                       <i class="fas fa-chart-line text-2xl text-white"></i>
                       <div class="absolute -top-1 -right-1 bg-green-500 text-white p-1 rounded-full">
                           <i class="fas fa-dollar-sign text-sm"></i>
                       </div>
                   </div>
                   <h3 class="text-xl font-semibold text-gray-800 mb-2">נתוני מכירות</h3>
                   <p class="text-gray-600">צפייה בביצועי המכירות שלי</p>
               </a>
           </div>

           <!-- Footer -->
           <div class="mt-8 text-center text-sm text-gray-600">
               <p class="flex items-center justify-center gap-2">
                   <i class="fas fa-info-circle"></i>
                   בחר את התסריט המתאים לשיחה שלך
               </p>
           </div>
       </div>
   </div>
</body>
</html>
